<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentFarm - AI Agent Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>AgentFarm</h1>
        <p>A platform for managing and monitoring AI agents</p>
    </header>

    <main>
        <section class="dashboard">
            <h2>Agent Dashboard</h2>
            <div class="controls">
                <button id="add-agent">Add New Agent</button>
                <button id="start-all">Start All Agents</button>
                <button id="stop-all">Stop All Agents</button>
            </div>
            <div class="agent-list" id="agent-container">
                <!-- Agents will be added here dynamically -->
            </div>
        </section>

        <section class="agent-form" id="agent-form">
            <h2>Create New Agent</h2>
            <form id="new-agent-form">
                <div class="form-group">
                    <label for="agent-name">Agent Name:</label>
                    <input type="text" id="agent-name" required>
                </div>
                <div class="form-group">
                    <label for="agent-type">Agent Type:</label>
                    <select id="agent-type">
                        <option value="assistant">Assistant</option>
                        <option value="researcher">Researcher</option>
                        <option value="analyzer">Analyzer</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="agent-description">Description:</label>
                    <textarea id="agent-description"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit">Create Agent</button>
                    <button type="button" id="cancel-form">Cancel</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 AgentFarm - Developed by Itz-Pixel-Dev</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
